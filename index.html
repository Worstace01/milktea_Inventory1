<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Tea Inventory & POS System</title>
    <meta name="description" content="An interactive inventory management and point-of-sale business system for milk tea shops. Created by Andrie Deuna.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-amber-950/20 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-900/40 via-slate-950 to-slate-950">

    <!-- Header -->
    <header class="max-w-5xl w-full mx-auto flex justify-between items-center bg-slate-900/80 backdrop-blur-md px-6 py-4 rounded-2xl border border-amber-900/30 shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 bg-amber-600 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg shadow-amber-600/30">
                🧋
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-orange-300">Milk Tea Inventory & POS</h1>
                <p class="text-xs text-amber-200/60">Business Management System</p>
            </div>
        </div>
        <div class="flex items-center gap-4 text-sm font-semibold">
            <div class="bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
                Total Revenue: <span id="revenueDisplay" class="text-emerald-400 font-extrabold text-base">₱0.00</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-5xl w-full mx-auto my-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left: Inventory Stock Levels -->
        <div class="bg-slate-900/70 backdrop-blur-xl p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-amber-200 flex items-center gap-2">
                <i class="fas fa-boxes text-amber-400"></i> Ingredient Stock Levels
            </h2>
            <div id="stockList" class="space-y-4"></div>
            <button id="restockBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold py-2.5 px-4 rounded-xl border border-amber-500/20 active:scale-95 transition text-sm flex items-center justify-center gap-2">
                <i class="fas fa-sync-alt"></i> Restock All Supplies
            </button>
        </div>

        <!-- Right: POS Menu & Transaction Log -->
        <div class="md:col-span-2 bg-slate-900/70 backdrop-blur-xl p-6 rounded-3xl border border-slate-800 shadow-xl space-y-6">
            <h2 class="text-lg font-bold text-amber-200 flex items-center gap-2">
                <i class="fas fa-cash-register text-emerald-400"></i> New Order Register
            </h2>

            <!-- Menu Drinks -->
            <div id="drinkMenu" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>

            <!-- Recent Orders Log -->
            <div class="pt-4 border-t border-slate-800">
                <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center justify-between">
                    <span>Recent Sales Transactions</span>
                    <span id="orderCount" class="text-xs font-normal text-slate-500">0 orders</span>
                </h3>
                <div class="max-h-48 overflow-y-auto pr-1">
                    <table class="w-full text-left text-sm">
                        <thead class="text-xs uppercase text-slate-500 border-b border-slate-800">
                            <tr>
                                <th class="pb-2">Time</th>
                                <th class="pb-2">Item</th>
                                <th class="pb-2 text-right">Price</th>
                            </tr>
                        </thead>
                        <tbody id="salesLog" class="divide-y divide-slate-800 text-slate-300">
                            <tr><td colspan="3" class="py-4 text-center text-slate-600 italic">No sales recorded yet. Select a drink above!</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer class="max-w-5xl w-full mx-auto text-center text-xs text-slate-500 py-3">
        &copy; 2026 Milk Tea Inventory System — Created by <a href="https://github.com/Worstace01" target="_blank" class="underline hover:text-slate-300">Andrie Deuna</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
